format: wordpress-rest-error
rfc9457: false
envelope:
  media_type: application/json
  note: >-
    The WordPress REST API does NOT emit RFC 9457 application/problem+json. Errors are served as
    application/json with a WordPress-specific envelope of {code, message, data}, where data.status
    repeats the HTTP status and data.params / data.details carry per-parameter validation detail.
    Recorded here so an agent binds to the real shape rather than assuming Problem Details.
  fields:
  - name: code
    type: string
    description: Machine-readable WordPress error slug, e.g. rest_post_invalid_id.
  - name: message
    type: string
    description: Human-readable message. Not localized on this host (en-US).
  - name: data.status
    type: integer
    description: HTTP status repeated inside the body.
  - name: data.params
    type: object
    description: Map of failing parameter name to a human-readable reason. Present on 400 only.
  - name: data.details
    type: object
    description: Map of failing parameter name to a nested {code, message, data} record. 400 only.
