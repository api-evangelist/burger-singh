aid: burger-singh
name: Burger Singh
description: >-
  Burger Singh is an Indian quick-service restaurant chain founded in 2014 by Kabir Jeet Singh with
  co-founders Nitin Rana and Rahul Seth, and operated by Tipping Mr Pink Private Limited out of
  Gurugram, Haryana. It sells Indian-flavoured "craft" burgers - regional recipes built on Indian
  spices and chutneys - alongside fries and sides, desserts and beverages, through a hybrid estate of
  company-owned and franchised outlets that spans high-street, food-court, express and dine-in
  formats across India and into the United Kingdom. The business grows primarily through franchising,
  and its public web surface is organised around that motion: a menu, a store locator, franchise
  investment brackets, property-partner and bulk-order intake, and a complaint and feedback channel.
  Burger Singh is a restaurant operator rather than a software vendor and publishes no developer
  program, no API documentation and no commercial or partner-facing API. The only machine-readable
  interface it exposes is the WordPress REST content API behind its corporate site at
  burgersinghonline.com, captured here for discovery purposes.
